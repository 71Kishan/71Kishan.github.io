name: Portfolio UI fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix-ui:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Patch portfolio UI
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path("index.html")
          html = path.read_text(encoding="utf-8")

          # Fix the hero/stage sizing so text never gets clipped at the bottom
          # of a cinematic viewport.
          css = r'''

        /* FINAL CINEMATIC FIT + NAVIGATION PATCH */
        .hero {
            min-height: auto;
            padding-top: calc(var(--nav-h) + 38px);
            padding-bottom: 88px;
        }

        .hero-grid {
            min-height: calc(100svh - var(--nav-h) - 70px);
        }

        .story-stage {
            padding-top: 64px;
            padding-bottom: 40px;
        }

        .stage-copy h2 {
            font-size: clamp(2.9rem, 5.15vw, 6.2rem);
            max-width: 720px;
        }

        .stage-copy p {
            max-width: 610px;
            font-size: clamp(13px, 1.12vw, 15px);
            line-height: 1.72;
        }

        .story-stage[data-stage="3"] .stage-copy h2 {
            max-width: 700px;
            font-size: clamp(2.65rem, 4.55vw, 5.55rem);
        }

        .story-stage[data-stage="3"] .stage-copy p {
            max-width: 590px;
        }

        .nav-cut {
            position: fixed;
            inset: 0;
            z-index: 300;
            pointer-events: none;
            opacity: 0;
            background: #050505;
            transition: opacity .18s ease;
        }

        .nav-cut.active {
            opacity: 1;
        }

        @media (max-width: 1050px) {
            .hero-grid {
                min-height: 0;
            }

            .story-stage {
                padding-top: 78px;
                padding-bottom: 34px;
            }
        }

        @media (max-width: 760px) {
            .hero {
                padding-top: calc(var(--nav-h) + 30px);
                padding-bottom: 70px;
            }

            .story-stage {
                padding-top: 72px;
                padding-bottom: 28px;
            }

            .stage-copy h2,
            .story-stage[data-stage="3"] .stage-copy h2 {
                font-size: clamp(2.45rem, 12.5vw, 4.8rem);
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .nav-cut {
                transition: none;
            }
        }
'''

          marker = '        @keyframes pulse {'
          if '/* FINAL CINEMATIC FIT + NAVIGATION PATCH */' not in html:
              html = html.replace(marker, css + '\n' + marker, 1)

          # Add a cinematic cut layer before the end of body.
          if '<div class="nav-cut" id="navCut" aria-hidden="true"></div>' not in html:
              html = html.replace('    <script>\n', '    <div class="nav-cut" id="navCut" aria-hidden="true"></div>\n\n    <script>\n', 1)

          # Direct navigation should not force users to travel through the long
          # sticky story. Replace the browser's long smooth traversal with a
          # brief cinematic cut + precise jump to the requested scene.
          nav_script = r'''

        // Cinematic direct-navigation: scroll naturally for the story experience,
        // but use a short scene cut when a visitor chooses a menu/CTA target.
        const navCut = document.getElementById("navCut");
        const directNavLinks = document.querySelectorAll(
            '.desktop-nav a[href^="#"], .mobile-menu a[href^="#"], .btn[href^="#"]'
        );

        directNavLinks.forEach((link) => {
            link.addEventListener("click", (event) => {
                const selector = link.getAttribute("href");
                const target = selector ? document.querySelector(selector) : null;
                if (!target || !navCut) return;

                event.preventDefault();
                navCut.classList.add("active");

                window.setTimeout(() => {
                    const navHeight = parseFloat(
                        getComputedStyle(document.documentElement).getPropertyValue("--nav-h")
                    ) || 74;
                    const top = Math.max(
                        0,
                        target.getBoundingClientRect().top + window.scrollY - navHeight - 6
                    );

                    window.scrollTo({ top, behavior: "auto" });
                    history.replaceState(null, "", selector);

                    window.setTimeout(() => {
                        navCut.classList.remove("active");
                    }, 110);
                }, 180);
            });
        });
'''

          if 'Cinematic direct-navigation: scroll naturally' not in html:
              html = html.replace('\n    </script>', nav_script + '\n    </script>', 1)

          path.write_text(html, encoding="utf-8")

      - name: Commit patched portfolio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "fix cinematic scene overflow and direct navigation"
          git push

      - name: Remove one-time workflow
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -f .github/workflows/portfolio-ui-fix.yml ]; then
            git rm .github/workflows/portfolio-ui-fix.yml
            git commit -m "remove one-time portfolio UI fix workflow"
            git push
          fi
